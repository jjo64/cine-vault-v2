openapi: 3.1.0
info:
  title: API CineVault
  description: Documentación oficial de la API de CineVault (red social de cine).
  version: 1.0.0
  contact:
    name: Equipo CineVault

servers:
  - url: https://api.cinevault.art/api
    description: Producción
  - url: http://localhost:4000/api
    description: Desarrollo local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token

  schemas:
    UsuarioPublico:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, editor, user] }
        avatar_url: { type: string, format: uri, nullable: true }
        bio: { type: string, maxLength: 300, nullable: true }
        is_verified: { type: boolean }
    DiaryEntry:
      type: object
      properties:
        id: { type: integer }
        movie_id: { type: integer }
        watched_date: { type: string, format: date }
        notes: { type: string, nullable: true }
    WatchlistItem:
      type: object
      properties:
        movie_id: { type: integer }
        tmdb_id: { type: integer, nullable: true }
        added_at: { type: string, format: date-time }
    Favorito:
      type: object
      properties:
        movie_id: { type: integer }
        rank_position: { type: integer, nullable: true }
    Resena:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        movie_id: { type: integer }
        content: { type: string }
        rating: { type: number, minimum: 1, maximum: 5 }
        likes: { type: integer }
        created_at: { type: string, format: date-time }
    Comentario:
      type: object
      properties:
        id: { type: integer }
        review_id: { type: integer }
        user_id: { type: integer }
        content: { type: string }
        created_at: { type: string, format: date-time }
    Notificacion:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        sender_id: { type: integer }
        type: { type: string, enum: [like, comment, follow, report_resolved] }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
    TwoFARequired:
      type: object
      properties:
        two_factor_required: { type: boolean, example: true }
        tokenTemporal: { type: string }
    MensajeResponse:
      type: object
      properties:
        message: { type: string }
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        code: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    ChangePasswordRequest:
      type: object
      required: [contrasenaActual, contrasenaNueva]
      properties:
        contrasenaActual: { type: string }
        contrasenaNueva: { type: string, minLength: 8 }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8 }
    CreateReviewRequest:
      type: object
      required: [movie_id, rating]
      properties:
        movie_id: { type: integer }
        rating: { type: number, minimum: 1, maximum: 5, multipleOf: 0.5 }
        content: { type: string }
    UpdateReviewRequest:
      type: object
      properties:
        rating: { type: number, minimum: 1, maximum: 5, multipleOf: 0.5 }
        content: { type: string }
    ReportReviewRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
    AddToListRequest:
      type: object
      required: [movie_id]
      properties:
        movie_id: { type: integer }
    AvatarRequest:
      type: object
      required: [avatar]
      properties:
        avatar: { type: string, description: Imagen base64 }
    ProfileRequest:
      type: object
      properties:
        username: { type: string }
        email: { type: string, format: email }
        bio: { type: string }
    PlanRequest:
      type: object
      required: [plan]
      properties:
        plan: { type: string, enum: [vip, pro] }

  responses:
    Unauthorized:
      description: No autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201': { description: Registrado }
        '409': { description: Usuario ya existe }

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - $ref: '#/components/schemas/TwoFARequired'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [Autenticación]
      summary: Renovar access token
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Token renovado, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        '200': { description: Sesión cerrada }

  /auth/verify:
    get:
      tags: [Autenticación]
      summary: Obtener perfil autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Perfil, content: { application/json: { schema: { $ref: '#/components/schemas/UsuarioPublico' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/verify-email/{token}:
    post:
      tags: [Autenticación]
      summary: Verificar email
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200': { description: Email verificado }
        '410': { description: Enlace expirado }

  /auth/resend-verification:
    post:
      tags: [Autenticación]
      summary: Reenviar email de verificación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Enviado si aplica }

  /auth/forgot-password:
    post:
      tags: [Autenticación]
      summary: Solicitar reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Enviado si aplica }

  /auth/reset-password:
    post:
      tags: [Autenticación]
      summary: Resetear contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200': { description: Contraseña actualizada }

  /auth/cambiar-contrasena:
    post:
      tags: [Autenticación]
      summary: Cambiar contraseña autenticado
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200': { description: Contraseña actualizada }

  /auth/revocar-sesiones:
    post:
      tags: [Autenticación]
      summary: Revocar todas las sesiones
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Sesiones revocadas }

  /auth/2fa/activar:
    post:
      tags: [Autenticación]
      summary: Generar QR 2FA
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Devuelve QR y secreto }

  /auth/2fa/confirmar:
    post:
      tags: [Autenticación]
      summary: Confirmar 2FA
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string }
      responses:
        '200': { description: 2FA activado }

  /auth/2fa/verificar:
    post:
      tags: [Autenticación]
      summary: Verificar 2FA en login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, tokenTemporal]
              properties:
                codigo: { type: string }
                tokenTemporal: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }

  /auth/2fa/desactivar:
    post:
      tags: [Autenticación]
      summary: Desactivar 2FA
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string }
      responses:
        '200': { description: 2FA desactivado }

  /users:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lista de usuarios, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UsuarioPublico' } } } } }

  /users/{id}:
    get:
      tags: [Usuarios]
      summary: Perfil público
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Perfil público }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/follow/{id}:
    post:
      tags: [Usuarios]
      summary: Seguir usuario
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Seguido }

  /users/unfollow/{id}:
    delete:
      tags: [Usuarios]
      summary: Dejar de seguir
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Unfollow ok }

  /users/{id}/followers:
    get:
      tags: [Usuarios]
      summary: Seguidores
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Lista de seguidores }

  /users/{id}/following:
    get:
      tags: [Usuarios]
      summary: Siguiendo
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Lista de seguidos }

  /settings:
    patch:
      tags: [Ajustes]
      summary: Actualizar perfil
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200': { description: Perfil actualizado }
    delete:
      tags: [Ajustes]
      summary: Eliminar cuenta
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cuenta eliminada }

  /settings/auth:
    patch:
      tags: [Ajustes]
      summary: Cambiar contraseña
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200': { description: Contraseña actualizada }

  /settings/avatar:
    patch:
      tags: [Ajustes]
      summary: Actualizar avatar
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarRequest'
      responses:
        '200': { description: Avatar actualizado }

  /diary:
    get:
      tags: [Diario]
      summary: Obtener mi diario
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Diario, content: { application/json: { schema: { type: object, properties: { diary: { type: array, items: { $ref: '#/components/schemas/DiaryEntry' } } } } } } }
    post:
      tags: [Diario]
      summary: Crear entrada
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movie_id]
              properties:
                movie_id: { type: integer }
                watched_date: { type: string, format: date }
                notes: { type: string }
      responses:
        '201': { description: Creada }

  /diary/{id}:
    delete:
      tags: [Diario]
      summary: Eliminar entrada
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Eliminada }

  /diary/{id_user}:
    get:
      tags: [Diario]
      summary: Diario de otro usuario
      parameters:
        - in: path
          name: id_user
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Diario público }

  /watchlist:
    get:
      tags: [Watchlist]
      summary: Mi watchlist
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lista, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WatchlistItem' } } } } }
    post:
      tags: [Watchlist]
      summary: Añadir a watchlist
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToListRequest'
      responses:
        '201': { description: Añadido }

  /watchlist/{movie_id}:
    delete:
      tags: [Watchlist]
      summary: Eliminar de watchlist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: movie_id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Eliminado }

  /watchlist/{id_user}:
    get:
      tags: [Watchlist]
      summary: Watchlist de otro usuario
      parameters:
        - in: path
          name: id_user
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Lista }

  /favorites:
    get:
      tags: [Favoritos]
      summary: Mis favoritos
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lista, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Favorito' } } } } }

  /favorites/user/{userId}:
    get:
      tags: [Favoritos]
      summary: Favoritos de un usuario
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Lista }

  /favorites/{movieId}:
    post:
      tags: [Favoritos]
      summary: Añadir favorito
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: movieId
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rank_position: { type: integer }
      responses:
        '201': { description: Añadido }
    delete:
      tags: [Favoritos]
      summary: Eliminar favorito
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: movieId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Eliminado }

  /reviews:
    get:
      tags: [Reseñas]
      summary: Mis reseñas
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lista, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Resena' } } } } }
    post:
      tags: [Reseñas]
      summary: Crear reseña
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201': { description: Creada }

  /reviews/user/{userId}:
    get:
      tags: [Reseñas]
      summary: Reseñas de un usuario
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Lista }

  /reviews/movie/{movieId}:
    get:
      tags: [Reseñas]
      summary: Reseñas por película
      parameters:
        - in: path
          name: movieId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Lista }

  /reviews/{reviewId}:
    patch:
      tags: [Reseñas]
      summary: Actualizar reseña
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200': { description: Actualizada }
    delete:
      tags: [Reseñas]
      summary: Eliminar reseña
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Eliminada }

  /reviews/{reviewId}/like:
    post:
      tags: [Reseñas]
      summary: Dar like
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: integer }
      responses:
        '201': { description: Like añadido }
    delete:
      tags: [Reseñas]
      summary: Quitar like
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Like eliminado }

  /reviews/{reviewId}/report:
    post:
      tags: [Reseñas]
      summary: Reportar reseña
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportReviewRequest'
      responses:
        '200': { description: Reporte creado }

  /reviews/{reviewId}/comments:
    get:
      tags: [Comentarios]
      summary: Listar comentarios
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Lista, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Comentario' } } } } }
    post:
      tags: [Comentarios]
      summary: Crear comentario
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201': { description: Creado }

  /reviews/comments/{commentId}:
    patch:
      tags: [Comentarios]
      summary: Actualizar comentario
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: commentId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '200': { description: Actualizado }
    delete:
      tags: [Comentarios]
      summary: Eliminar comentario
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: commentId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Eliminado }

  /search:
    get:
      tags: [Búsqueda]
      summary: Búsqueda general de películas
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        '200': { description: Resultados }

  /search/multi:
    get:
      tags: [Búsqueda]
      summary: Búsqueda múltiple
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: Resultados }

  /search/movie:
    get:
      tags: [Búsqueda]
      summary: Búsqueda de películas
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: Resultados }

  /search/person:
    get:
      tags: [Búsqueda]
      summary: Búsqueda de personas
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: Resultados }

  /search/tv:
    get:
      tags: [Búsqueda]
      summary: Búsqueda de series
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: Resultados }

  /movies/upcoming:
    get:
      tags: [Películas]
      summary: Próximos estrenos
      responses:
        '200': { description: Lista }

  /movies/top-rated:
    get:
      tags: [Películas]
      summary: Más valoradas
      responses:
        '200': { description: Lista }

  /movies/popular:
    get:
      tags: [Películas]
      summary: Populares
      responses:
        '200': { description: Lista }

  /movies/{idOrSlug}:
    get:
      tags: [Películas]
      summary: Detalle por ID o slug
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema: { type: string }
      responses:
        '200': { description: Detalle }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications:
    get:
      tags: [Notificaciones]
      summary: Mis notificaciones
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lista, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notificacion' } } } } }

  /notifications/unread:
    get:
      tags: [Notificaciones]
      summary: Contador de no leídas
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Conteo }

  /notifications/pending:
    get:
      tags: [Notificaciones]
      summary: Entregar pendientes
